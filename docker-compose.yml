# Stack local de homologação. Não usar em produção.
name: meu-barbeiro-local

x-mock-env: &mock-env
  MERCADO_PAGO_WEBHOOK_SECRET: mock-webhook-secret
  MOCK_SELLER_ID: "123456789"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meubarbeiro
      POSTGRES_PASSWORD: meubarbeiro
      POSTGRES_DB: meubarbeiro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meubarbeiro"]
      interval: 3s
      timeout: 3s
      retries: 20

  mp-mock:
    image: node:24-slim
    working_dir: /app
    command: node server.mjs
    environment:
      <<: *mock-env
      PORT: "4444"
      MOCK_PUBLIC_URL: http://localhost:4444
      MOCK_API_INTERNAL_URL: http://api:3333
      MOCK_FRONTEND_URL: http://localhost:8080
    volumes:
      - ./local/mp-mock:/app:ro
    ports: ["4444:4444"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: >
      sh -c "pnpm prisma migrate deploy &&
             pnpm exec tsx src/seed.ts &&
             pnpm exec tsx watch src/server.ts"
    volumes:
      - ./api/src:/app/api/src:ro
      - ./api/prisma:/app/api/prisma:ro
    environment:
      <<: *mock-env
      NODE_ENV: development
      PORT: "3333"
      DATABASE_URL: postgresql://meubarbeiro:meubarbeiro@db:5432/meubarbeiro?schema=public
      SESSION_SECRET: local-homolog-secret
      TOKEN_ENCRYPTION_KEY: Bw4VHCMqMTg/Rk1UW2JpcHd+hYyTmqGor7a9xMvS2eA=
      FRONTEND_URL: http://localhost:8080
      API_PUBLIC_URL: http://localhost:8080/api
      DEFAULT_BARBERSHOP_SLUG: barbearia-central
      ENABLE_DEV_LOGIN: "true"
      MERCADO_PAGO_API_URL: http://mp-mock:4444
      MERCADO_PAGO_AUTH_URL: http://localhost:4444
      MERCADO_PAGO_ACCESS_TOKEN: mock-platform-access-token
      MERCADO_PAGO_CLIENT_ID: mock-client-id
      MERCADO_PAGO_CLIENT_SECRET: mock-client-secret
    depends_on:
      db: { condition: service_healthy }
    ports: ["3333:3333"]

  web:
    build:
      context: .
      args:
        VITE_API_URL: /api
    volumes:
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    ports: ["8080:80"]
